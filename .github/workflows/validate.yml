name: Validate DreamUI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate theme assets
        run: python3 tools/validate.py
      - name: Test isolated deployment and restoration
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Check panel script syntax
        run: node --check layouts/classic-panel.js
      - name: Check vector source reproducibility
        run: |
          python3 tools/build_assets.py
          python3 tools/build_preview.py
          git diff --exit-code -- assets docs/design/desktop-concept.svg
